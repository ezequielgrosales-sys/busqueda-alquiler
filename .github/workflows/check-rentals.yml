name: Buscar alquileres nuevos

on:
  schedule:
    # Corre cada 12 horas (9 y 21 hs UTC = 6 y 18 hs de Argentina).
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña "Actions"

# Necesario para que el workflow pueda commitear data/seen.json de vuelta al repo
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar navegador headless (Playwright)
        run: playwright install --with-deps chromium

      - name: Correr scraper
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper.py

      - name: Guardar publicaciones ya vistas
        run: |
          git config user.name "rental-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "Actualizar publicaciones vistas [skip ci]"
          git push

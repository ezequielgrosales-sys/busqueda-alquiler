name: Buscar alquileres nuevos

on:
  schedule:
    # Corre cada 3 horas. Los horarios de GitHub Actions están en UTC.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña "Actions"

# Necesario para que el workflow pueda commitear data/seen.json de vuelta al repo
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr scraper
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scraper.py

      - name: Guardar publicaciones ya vistas
        run: |
          git config user.name "rental-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "Actualizar publicaciones vistas [skip ci]"
          git push
